services:
  db:
    image: pgvector/pgvector:pg17
    container_name: earagmvp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - earagmvp_db:/var/lib/postgresql/data

volumes:
  earagmvp_db:
